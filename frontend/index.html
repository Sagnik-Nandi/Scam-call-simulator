<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scam Call Simulator</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #5b6574; --line: #dde1e7;
    --accent: #1f6feb; --good: #1a7f37; --bad: #c62828; --warn: #b35900; --call: #1b2330; --callink: #f2f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1319; --card: #181d26; --ink: #eef1f5; --muted: #9aa5b5; --line: #2b3342;
      --accent: #5b9dff; --good: #4cc38a; --bad: #ff7b72; --warn: #f0a04b; --call: #0b0e13; --callink: #eef1f5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  h2 { font-size: 1.15rem; margin: 24px 0 8px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
  label { display: block; font-weight: 600; margin: 10px 0 6px; }
  select, input[type=text] { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer; min-height: 48px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: #fff; width: 100%; }
  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .hidden { display: none !important; }
  .persona { background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 4px 14px 10px; margin-top: 14px; }

  /* call screen */
  .call { background: var(--call); color: var(--callink); border-radius: 18px; padding: 18px; }
  .banner { background: #fff3cd; color: #5c4400; border-radius: 10px; padding: 10px 12px; font-size: .9rem; font-weight: 600; }
  .who { text-align: center; margin: 18px 0 6px; }
  .who .name { font-size: 1.3rem; font-weight: 700; }
  .status { text-align: center; color: #aab4c3; min-height: 1.5em; }
  .answer { background: #1a9d4b; color: #fff; width: 100%; font-size: 1.15rem; padding: 18px; }
  .controls { display: flex; gap: 12px; margin-top: 14px; }
  .mic { flex: 1; background: #2a7de1; color: #fff; font-size: 1.05rem; }
  .mic.rec { background: #d93025; animation: pulse 1.2s infinite; }
  .hang { background: #d93025; color: #fff; }
  .mic:disabled { opacity: .45; cursor: not-allowed; }
  @keyframes pulse { 50% { opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { .mic.rec { animation: none; } }
  .otp { background: #fff; color: #14181f; border-radius: 12px; padding: 10px 14px; margin-top: 14px; text-align: center; }
  .otp .code { font-size: 2rem; letter-spacing: .25em; font-weight: 800; font-variant-numeric: tabular-nums; }
  .otp small { color: #5b6574; display: block; }
  .log { list-style: none; padding: 0; margin: 14px 0 0; max-height: 220px; overflow-y: auto; }
  .log li { margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.07); font-size: .95rem; }
  .log li.you { background: rgba(42,125,225,.28); }
  .log b { display: block; font-size: .75rem; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
  .dev { display: flex; gap: 8px; margin-top: 12px; }
  .dev input { flex: 1; }

  /* debrief */
  .headline { font-size: 1.25rem; font-weight: 700; }
  .win { color: var(--good); } .lose { color: var(--bad); } .idle { color: var(--warn); }
  .tactic { border-left: 5px solid var(--line); padding: 4px 0 4px 12px; margin: 14px 0; }
  .tactic.worked { border-color: var(--bad); }
  .tactic.resisted { border-color: var(--good); }
  .tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--line); }
  .tactic.worked .tag { background: var(--bad); color: #fff; }
  .tactic.resisted .tag { background: var(--good); color: #fff; }
  .instead { font-weight: 600; }
  .help { background: var(--accent); color: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
  .err { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<main>
  <!-- 1. setup -->
  <section id="setup">
    <h1 id="t-title">Scam Call Simulator</h1>
    <p class="muted" id="t-tagline"></p>
    <div class="card">
      <label for="lang" id="t-lang">Language</label>
      <select id="lang"></select>
      <div class="persona">
        <p><b id="t-persona-title"></b></p>
        <p id="t-persona-text"></p>
        <label for="nick" id="t-nick" style="font-weight:500"></label>
        <input id="nick" type="text" maxlength="20" autocomplete="off">
        <p class="muted" id="t-nick-hint" style="font-size:.85rem"></p>
      </div>
      <div id="inviteRow" class="hidden">
        <label for="invite">Invite code</label>
        <input id="invite" type="text" autocomplete="off">
      </div>
      <p class="muted" id="reviewNote" style="font-size:.85rem"></p>
      <button class="primary" id="start" style="margin-top:14px"></button>
    </div>
    <p class="muted" style="font-size:.9rem">Everything here is a simulation with pre-recorded lines and a practice OTP. No real calls are made and nothing you say is stored.</p>
  </section>

  <!-- 2. call -->
  <section id="callScreen" class="hidden">
    <div class="call">
      <div class="banner" id="banner"></div>
      <div class="who"><div class="name" id="callerName"></div><div class="status" id="status"></div></div>
      <button class="answer hidden" id="answer"></button>
      <p class="err" id="err" role="alert"></p>
      <div id="inCall" class="hidden">
        <div class="otp hidden" id="otpCard"><small id="otpLabel"></small><div class="code" id="otpCode"></div><small id="otpHint"></small></div>
        <ul class="log" id="log" aria-live="polite"></ul>
        <div class="controls">
          <button class="mic" id="mic"></button>
          <button class="hang" id="hang"></button>
        </div>
        <div class="dev hidden" id="dev"><input id="devText" type="text"><button class="ghost" id="devSend" style="color:#fff;border-color:#556"></button></div>
        
      </div>
    </div>
  </section>

  <!-- 3. debrief -->
  <section id="debrief" class="hidden"></section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const SPEECH_LANG = {en: "en-IN", hi: "hi-IN", bn: "bn-IN"};
const MAX_RECORD_MS = 15000, SILENCE_MS = 12000;

let cfg = null, ui = {}, lang = "en", sid = null, invite = "";
let recorder = null, chunks = [], recTimer = null, silenceTimer = null, busy = false, ended = false;
let player = new Audio();
let otpShown = false, firstReply = null, answered = false;

function pref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function getPref(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function applyUI() {
  const l = cfg.languages.find(x => x.code === lang);
  ui = l.ui;
  document.documentElement.lang = lang;
  $("t-title").textContent = ui.title; $("t-tagline").textContent = ui.tagline;
  $("t-lang").textContent = ui.choose_language; $("start").textContent = ui.answer;
  $("banner").textContent = ui.banner; $("callerName").textContent = ui.unknown_caller;
  $("answer").textContent = ui.answer; $("hang").textContent = ui.hang_up;
  $("otpLabel").textContent = ui.otp_label; $("otpHint").textContent = ui.otp_hint;
  $("devText").placeholder = ui.type_placeholder; $("devSend").textContent = ui.send;
  $("mic").textContent = ui.tap_speak;
  const p = l.persona;
  $("t-persona-title").textContent = ui.persona_title;
  $("t-persona-text").textContent = ui.persona_text.replace("{name}", p.name).replace("{last4}", p.last4);
  $("t-nick").textContent = ui.nickname_label; $("t-nick-hint").textContent = ui.nickname_hint;
  $("reviewNote").textContent = (l.code !== "en" && /draft/i.test(l.review_status || "")) ? "Translation: " + l.review_status : "";
  document.title = ui.title;
}

async function init() {
  cfg = await (await fetch("/api/config")).json();
  const sel = $("lang");
  cfg.languages.forEach(l => sel.add(new Option(l.name, l.code)));
  lang = getPref("lang") || "en"; if (!cfg.languages.some(l => l.code === lang)) lang = "en";
  sel.value = lang;
  sel.onchange = () => { lang = sel.value; pref("lang", lang); applyUI(); };
  if (cfg.invite_required) $("inviteRow").classList.remove("hidden");
  if (cfg.allow_text) $("dev").classList.remove("hidden");
  applyUI();
  $("start").onclick = async () => {
    invite = $("invite").value.trim();
    $("setup").classList.add("hidden"); $("callScreen").classList.remove("hidden");
    $("status").textContent = ui.incoming;
    try {
      const r = await fetch("/api/session", {method: "POST", headers: {"Content-Type": "application/json", "X-Invite-Code": invite},
        body: JSON.stringify({language: lang, scenario: "digital_arrest", nickname: $("nick").value.trim()})});
      if (!r.ok) throw new Error((await r.json()).detail || r.status);
      const body = await r.json(); sid = body.session_id; firstReply = body.reply;
      $("answer").classList.remove("hidden");
    } catch (e) {
      showError(ui.error + " (" + e.message + ")");
      const again = el("button", "ghost", ui.again); again.style.color = "#fff"; again.onclick = () => location.reload();
      $("callScreen").querySelector(".call").append(again);
    }
  };
  $("answer").onclick = answerCall;
  $("mic").onclick = toggleRecord;
  $("hang").onclick = hangUp;
  $("devSend").onclick = () => { const t = $("devText").value; $("devText").value = ""; sendTurn({text: t}); };
}

function say(who, text) {
  if (!text) return;
  const li = document.createElement("li"); if (who === "you") li.className = "you";
  const b = document.createElement("b"); b.textContent = who === "you" ? ui.transcript_you : ui.transcript_caller;
  li.append(b, document.createTextNode(text));
  $("log").append(li); $("log").scrollTop = 1e6;
}

function showError(msg) { $("err").textContent = msg || ""; }

function setOtp(code) {
  if (!code) return;
  $("otpCode").textContent = code.split("").join(" ");
  $("otpCard").classList.remove("hidden");
}

function playClip(url, text) {
  player.pause(); if ("speechSynthesis" in window) speechSynthesis.cancel();    // never talk over a previous clip
  return new Promise(resolve => {
    if (url) {
      player.onended = player.onerror = () => resolve();
      player.src = url; player.play().catch(() => resolve());
    } else if ("speechSynthesis" in window && text) {   // dev fallback when a clip has not been pre-rendered
      const u = new SpeechSynthesisUtterance(text); u.lang = SPEECH_LANG[lang] || "en-IN";
      u.onend = u.onerror = () => resolve(); speechSynthesis.speak(u);
    } else resolve();
  });
}

async function playReply(reply) {
  clearTimeout(silenceTimer);
  if (!reply) return;
  say("caller", reply.text); if (reply.otp) setOtp(reply.otp);
  $("status").textContent = ui.caller_speaking; $("mic").disabled = true;
  await playClip(reply.audio_url, reply.text);
}

async function answerCall() {
  if (!sid || !firstReply || answered) return;          // the call is not ready yet
  answered = true;
  $("answer").classList.add("hidden"); $("inCall").classList.remove("hidden"); $("status").textContent = "…";
  try { await playReply(firstReply); readyForUser(); }
  catch (e) { showError(ui.error + " (" + e.message + ")"); }
}

function readyForUser() {
  if (ended) return;
  busy = false; $("mic").disabled = false; $("mic").textContent = ui.tap_speak; $("mic").classList.remove("rec");
  $("status").textContent = "";
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(() => { if (!recorder && !busy && !ended && player.paused) sendTurn({}); }, SILENCE_MS);
}

async function toggleRecord() {
  if (recorder) return stopRecord();
  clearTimeout(silenceTimer); showError("");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
    const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    recorder = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined); chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type: recorder.mimeType}); recorder = null;
      sendTurn({audio: blob});
    };
    recorder.start();
    $("mic").textContent = ui.tap_send; $("mic").classList.add("rec"); $("status").textContent = ui.listening;
    recTimer = setTimeout(stopRecord, MAX_RECORD_MS);
  } catch (e) { showError(ui.mic_denied); readyForUser(); }
}

function stopRecord() { clearTimeout(recTimer); if (recorder && recorder.state !== "inactive") recorder.stop(); }

async function sendTurn({audio, text}) {
  if (busy || ended) return; busy = true; clearTimeout(silenceTimer);
  $("mic").disabled = true; $("mic").classList.remove("rec"); $("mic").textContent = ui.tap_speak; $("status").textContent = "…";
  const fd = new FormData(); fd.append("silence", "1");
  if (audio) fd.append("audio_file", audio, "turn.webm");
  if (text !== undefined) fd.append("text", text);
  try {
    const r = await fetch(`/api/session/${sid}/turn`, {method: "POST", body: fd});
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const res = await r.json();
    say("you", res.transcript);
    await playReply(res.reply);
    if (res.done) return finish(res.debrief);
    readyForUser();
  } catch (e) { showError(ui.error + " (" + e.message + ")"); busy = false; readyForUser(); }
}

async function hangUp() {
  if (ended) return; clearTimeout(silenceTimer); stopRecord(); player.pause(); speechSynthesis && speechSynthesis.cancel();
  if (!sid) { return location.reload(); }
  try { const r = await (await fetch(`/api/session/${sid}/hangup`, {method: "POST"})).json(); finish(r.debrief); }
  catch (e) { showError(ui.error); }
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function finish(d) {
  ended = true; clearTimeout(silenceTimer);
  $("callScreen").classList.add("hidden");
  const box = $("debrief"); box.replaceChildren(); box.classList.remove("hidden");
  box.append(el("h1", "", ui.debrief_title));
  const card = el("div", "card"); card.append(el("p", "headline " + d.outcome, d.summary)); box.append(card);

  box.append(el("h2", "", ui.tactics_title));
  d.tactics.forEach(t => {
    const c = el("div", "tactic " + (t.worked ? "worked" : "resisted"));
    c.append(el("span", "tag", t.worked ? d.labels.worked : d.labels.resisted));
    c.append(el("div", "", t.name)); c.lastChild.style.fontWeight = "700";
    c.append(el("p", "muted", t.what)); c.append(el("p", "instead", t.instead));
    box.append(c);
  });

  box.append(el("h2", "", ui.facts_title));
  const ul = el("ul"); d.facts.forEach(f => ul.append(el("li", "", f))); box.append(ul);
  box.append(el("p", "help", d.help));
  box.append(el("p", "muted", d.disclaimer));

  const row = el("div", "controls");
  if (d.audio && d.audio.length) {
    const play = el("button", "ghost", ui.play_debrief);
    play.onclick = async () => { play.disabled = true; for (const u of d.audio) await playClip(u); play.disabled = false; };
    row.append(play);
  }
  const again = el("button", "primary", ui.again); again.onclick = () => location.reload();
  row.append(again); box.append(row);
  window.scrollTo(0, 0);
}

init();
</script>
</body>
</html>
